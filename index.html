<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive To-Do List & Weather Dashboard Application.">
  <title>Portfolio, To-Do & Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Task Manager & Weather Portfolio</h1>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html" aria-current="page">Home</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <!-- Weather Dashboard Section (Task 4) -->
    <section aria-labelledby="weather-heading" style="margin-bottom: 2rem;">
      <h2 id="weather-heading">Real-Time Weather Dashboard</h2>
      
      <form id="weather-form" style="margin-bottom: 1rem;">
        <div class="form-group">
          <label for="city-input">City Name:</label>
          <input type="text" id="city-input" placeholder="Enter city (e.g. Chennai, London)" required autocomplete="off">
        </div>
        <button type="submit">Search Weather</button>
      </form>

      <!-- Weather Display Area -->
      <div id="weather-result" class="card" style="display: none;">
        <h3 id="city-name"></h3>
        <p id="temperature"></p>
        <p id="weather-desc"></p>
        <p id="humidity"></p>
        <p id="wind-speed"></p>
      </div>
      <p id="weather-error" style="color: #dc2626; font-weight: bold; margin-top: 0.5rem;"></p>
    </section>

    <!-- To-Do List Section (Task 3) -->
    <section aria-labelledby="todo-heading">
      <h2 id="todo-heading">Interactive To-Do List</h2>
      <form id="todo-form">
        <div class="form-group">
          <label for="todo-input">New Task:</label>
          <input type="text" id="todo-input" placeholder="What needs to be done?" required autocomplete="off">
        </div>
        <button type="submit">Add Task</button>
      </form>

      <div class="filter-buttons" style="margin: 1rem 0; display: flex; gap: 0.5rem;">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="todo-list" style="list-style: none; padding: 0;"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Solaieswari. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
