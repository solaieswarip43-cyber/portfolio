<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive To-Do List Application with DOM Manipulation and LocalStorage.">
  <title>Portfolio & To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Task Manager Portfolio</h1>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html" aria-current="page">Home</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section aria-labelledby="todo-heading">
      <h2 id="todo-heading">Interactive To-Do List</h2>
      
      <!-- Task Add Form (Create) -->
      <form id="todo-form">
        <div class="form-group">
          <label for="todo-input">New Task:</label>
          <input type="text" id="todo-input" placeholder="What needs to be done?" required autocomplete="off">
        </div>
        <button type="submit">Add Task</button>
      </form>

      <!-- Filter Buttons -->
      <div class="filter-buttons" style="margin: 1rem 0; display: flex; gap: 0.5rem;">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- Task List (Read, Update, Delete) -->
      <ul id="todo-list" style="list-style: none; padding: 0;"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Solaieswari. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
